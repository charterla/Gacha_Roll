<!DOCTYPE html>
<html lang="zh-mo">
<head>
    <meta charset="utf-8" />
    <title>抽奬</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary-gold: #f59e0b;
            --primary-gold-hover: #d97706;
            --accent-blue: #2563eb;
            --accent-blue-hover: #1d4ed8;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(245, 158, 11, 0.08) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            padding: 2rem;
            flex-wrap: wrap;
        }

        body > div {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        svg {
            max-width: 100%;
            height: auto;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.05));
            overflow: visible;
        }

        body > div:nth-child(2) {
            width: 360px;
            align-items: stretch;
            gap: 1.25rem;
        }

        label[for="candidates"] {
            font-size: 1.1rem;
            color: var(--text-main);
            letter-spacing: 0.05em;
            display: block;
        }

        textarea#candidates {
            width: 100%;
            background-color: #f1f5f9;
            color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1rem;
            font-size: 1rem;
            font-family: monospace;
            line-height: 1.5;
            resize: vertical;
            outline: none;
            transition: all 0.25s ease;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        textarea#candidates:focus {
            background-color: #ffffff;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15), inset 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        button {
            width: 100%;
            padding: 0.85rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.05em;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button[onclick="drawSlot()"] {
            background-color: #f1f5f9;
            color: var(--accent-blue);
            border: 1px solid #cbd5e1;
        }

        button[onclick="drawSlot()"]:hover {
            background-color: #e2e8f0;
            border-color: var(--accent-blue);
            color: var(--accent-blue-hover);
            transform: translateY(-1px);
        }

        button[onclick="doSlot()"] {
            background: linear-gradient(135deg, #fbbf24, var(--primary-gold));
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25);
            font-size: 1.1rem;
        }

        button[onclick="doSlot()"]:hover {
            background: linear-gradient(135deg, var(--primary-gold), var(--primary-gold-hover));
            box-shadow: 0 6px 16px rgba(245, 158, 11, 0.35);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(1px) !important;
            box-shadow: none !important;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem;
                gap: 1rem;
            }
            body > div:nth-child(2) {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div>
        <svg height="520" width="520" viewBox="0 0 520 520">
            <defs>
                <clipPath id="range"><rect x="0" y="0" height="500" width="520" /></clipPath>
                <linearGradient id="cover" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
                    <stop offset="35%" stop-color="#ffffff" stop-opacity="0" />
                    <stop offset="65%" stop-color="#ffffff" stop-opacity="0" />
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9" />
                </linearGradient>
            </defs>
            <rect id="highlight_mf" x="10" y="220" height="70" width="500" fill="#f59e0b" fill-opacity="0.12" />
            <g id="slotGroup" clip-path="url(#range)"></g>
            <line id="highlight_tl" x1="12" y1="220" x2="508" y2="220" stroke="#f59e0b" stroke-width="2" />
            <line id="highlight_bl" x1="12" y1="290" x2="508" y2="280" stroke="#f59e0b" stroke-width="2" />
            <rect id="frame" x="10" y="10" height="490" width="500" rx="15" ry="15" 
                stroke="#cbd5e1" stroke-width="4" fill="url(#cover)" />
        </svg>
    </div>
    <div>
        <label for="candidates"><b>請輸入名單：</b></label>
        <textarea id="candidates" name="candidates" cols="40" rows="15">1,2,3,4,5,6</textarea>
        <button onclick="drawSlot()">更新名單</button>
        <button onclick="doSlot()">開始抽獎</button>
    </div>
</body>
<script>
    const x = 110, y = 20, h = 50, w = 300, r = 8;
    const colors = ['#dc2626', '#ea580c', '#d97706', '#059669', '#2563eb', '#7c3aed', '#db2777', '#0d9488'];

    function drawSlot() {
        let text = document.getElementById("candidates").value;
        let candidates = text.split(",").map(c => c.trim()).filter(c => c.length > 0);
        if (candidates.length === 0) return;

        let group = document.getElementById("slotGroup");
        group.innerHTML = "";

        candidates.forEach((candidate, index) => {
            let rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            rect.setAttribute("x", x); rect.setAttribute("y", y);
            rect.setAttribute("height", h); rect.setAttribute("width", w);
            rect.setAttribute("rx", r); rect.setAttribute("ry", r);
            rect.setAttribute("fill", "#ffffff");
            rect.setAttribute("stroke", colors[index % colors.length]);
            rect.setAttribute("stroke-width", "3");

            let textNode = document.createElementNS("http://www.w3.org/2000/svg", "text");
            textNode.setAttribute("x", x + w / 2 + 1.5);
            textNode.setAttribute("y", y + h / 2 + 1.5);
            textNode.setAttribute("fill", "#1e293b");
            textNode.setAttribute("font-size", "18");
            textNode.setAttribute("font-weight", "bold");
            textNode.setAttribute("text-anchor", "middle");
            textNode.setAttribute("dominant-baseline", "middle");
            textNode.textContent = candidate;

            let node = document.createElementNS("http://www.w3.org/2000/svg", "g");
            node.appendChild(rect); node.appendChild(textNode);
            node.setAttribute("transform", `translate(0, ${(y + h) * index})`);
            node.setAttribute("id", `node_${index}`);
            group.appendChild(node);
        });

        let slotNum = Math.min(7, (candidates.length % 2 === 0 ? candidates.length - 1 : candidates.length));
        document.getElementById("frame").setAttribute("height", ((y + h) * slotNum).toString());
        document.getElementById("range").childNodes[0].setAttribute("y", "10");
        document.getElementById("range").childNodes[0].setAttribute("height", (((y + h) * slotNum)).toString());
        document.getElementById("highlight_mf").setAttribute("y", (((y + h) * (slotNum - 1) / 2) + 10).toString());
        document.getElementById("highlight_tl").setAttribute("y1", (((y + h) * (slotNum - 1) / 2) + 10).toString());
        document.getElementById("highlight_tl").setAttribute("y2", (((y + h) * (slotNum - 1) / 2) + 10).toString());
        document.getElementById("highlight_bl").setAttribute("y1", (((y + h) * (slotNum + 1) / 2) + 10).toString());
        document.getElementById("highlight_bl").setAttribute("y2", (((y + h) * (slotNum + 1) / 2) + 10).toString());
        document.getElementsByTagName("svg")[0].setAttribute("viewBox", `0 ${(y + h) * (slotNum - 7) / 2} 520 520`);
    } 
    drawSlot();

    var isSpinning = false;
    function doSlot() {
        if (isSpinning) return;
        isSpinning = true;

        let text = document.getElementById("candidates").value;
        let candidates = text.split(",").map(c => c.trim()).filter(c => c.length > 0);
        if (candidates.length === 0) {
            isSpinning = false; 
            return; 
        }

        let rounds = 5, startTime = null, duration = 4000;
        let itemHeight = y + h, totalItems = candidates.length;
        let totalLoopHeight = totalItems * itemHeight;
        
        let centerSlotIndex = (Math.min(7, (candidates.length % 2 === 0 ? candidates.length - 1 : candidates.length)) - 1) / 2;
        let winnerIndex = Math.floor(Math.random() * candidates.length);
        
        let targetTranslateY = -(rounds * totalItems + winnerIndex - centerSlotIndex) * itemHeight;

        function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

        function animate(currentTime) {
            if (!startTime) startTime = currentTime;
            let elapsed = currentTime - startTime;
            let progress = Math.min(elapsed / duration, 1);

            let easedProgress = easeOutCubic(progress);
            let currentTotalOffset = targetTranslateY * easedProgress;

            candidates.forEach((_, idx) => {
                let node = document.getElementById(`node_${idx}`);
                if (node) {
                    let baseOffsetY = itemHeight * idx;
                    let calculatedY = ((baseOffsetY + currentTotalOffset) % totalLoopHeight + totalLoopHeight) % totalLoopHeight;

                    node.setAttribute("transform", `translate(0, ${calculatedY})`);
                }
            });

            if (progress < 1) {
                requestAnimationFrame(animate); 
            } else {
                isSpinning = false;
            }
        } 
        requestAnimationFrame(animate);
    }
</script>
</html>
